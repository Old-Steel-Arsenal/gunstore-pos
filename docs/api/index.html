<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- CSP pins the page fully offline: it blocks Redoc's phone-home for
       the Redocly badge (cdn.redoc.ly) and any future external fetch the
       bundle might grow. Redoc needs inline styles (styled-components)
       and a blob: worker (search index). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src blob:; object-src 'none'">
  <title>GunStore POS API</title>
  <!-- Fully offline: vendored Redoc bundle, no CDN, no web fonts.
       Open via `make api-docs-serve` — file:// cannot fetch openapi.json. -->
  <style>
    html, body { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="redoc"></div>
  <script src="./assets/redoc.standalone.js"></script>
  <!-- Init lives in an external file: script-src has no 'unsafe-inline'
       (see the CSP note above), so an inline initializer would be blocked
       and render a blank page (qa r2 BUG-5). -->
  <script src="./assets/init.js"></script>
</body>
</html>
